spring.application.name=pharmacy-backend

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Backup Configuration
backup.enabled=true
backup.local-path=D:/Project/HSProject/backups
backup.mysqldump-path="C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
#backup.schedule-cron=0 0 2 * * *
backup.schedule-cron=0 5 1 * * *
backup.retention-days=30
backup.compress=true

# Email Configuration (for backup notifications)
backup.email.enabled=false
backup.email.host=smtp.gmail.com
backup.email.port=587
backup.email.username=your-email@gmail.com
backup.email.password=your-app-password
backup.email.to=admin@pharmacy.com

# OneDrive Configuration (for cloud backup)
backup.onedrive.enabled=false
backup.onedrive.client-id=your-client-id
backup.onedrive.client-secret=your-client-secret
backup.onedrive.tenant-id=your-tenant-id
backup.onedrive.folder=/PharmacyBackups

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration.ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5174

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Exclude ObservationAutoConfiguration (micrometer observation issue)
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.observation.ObservationAutoConfiguration
